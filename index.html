<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OS em aberto – Pós-venda</title>
<style>
:root{--bg:#eef1f4;--ink:#16222d;--mut:#5d6c7a;--card:#fff;--line:#d3dae1;--verde:#2e9e5b;--amarelo:#e6ac12;--vermelho:#d3382d;--cinza:#9aa7b3;--acc:#0d5c75;--roxo:#8f5fe8;--azul:#1f7ae0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Bahnschrift","Segoe UI",system-ui,sans-serif}
header,main,#graf{max-width:1100px;margin:auto;padding-left:16px;padding-right:16px}
header{padding-top:18px;padding-bottom:8px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:26px;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;border:0;border-radius:6px;padding:9px 14px;background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
:focus-visible{outline:3px solid #7fb8c9;outline-offset:2px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:14px}
.s{background:var(--card);color:var(--ink);text-align:left;border-radius:8px;padding:10px 12px;border-top:5px solid var(--cinza);cursor:pointer}.s.active{box-shadow:0 0 0 3px var(--acc)}
.s b{font-size:30px;font-weight:600;display:block;line-height:1.1}
.s span{font-size:13px;color:var(--mut)}
.s.verde{border-color:var(--verde)}.s.amarelo{border-color:var(--amarelo)}.s.vermelho{border-color:var(--vermelho)}.s.peca{border-color:var(--azul)}
.flt{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.flt label,dialog label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
select,input[type=text],input[type=date],input[type=password],textarea{font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink)}
main{padding-top:8px;padding-bottom:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.blk{background:var(--card);border-radius:10px;border-left:10px solid var(--cinza);overflow:hidden}
.blk.verde{border-color:var(--verde)}.blk.amarelo{border-color:var(--amarelo)}.blk.vermelho{border-color:var(--vermelho)}
.blk.zero{opacity:.6}
.blk.open{grid-column:1/-1}
.head{all:unset;box-sizing:border-box;display:flex;width:100%;padding:14px;gap:10px;align-items:center;cursor:pointer}
div.head{cursor:default}
.nm{font-size:19px;font-weight:600;flex:1}
.ct{font-size:14px;color:var(--mut)}
.dots{display:flex;gap:4px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--cinza)}
.dot.verde{background:var(--verde)}.dot.amarelo{background:var(--amarelo)}.dot.vermelho{background:var(--vermelho)}
.list{display:none;padding:0 12px 12px;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.blk.open .list{display:grid}
.os{border:1px solid var(--line);border-left:6px solid var(--cinza);border-radius:8px;padding:10px 12px;background:#fafbfc;display:flex;flex-direction:column;gap:6px}
.os.verde{border-left-color:var(--verde)}.os.amarelo{border-left-color:var(--amarelo)}.os.vermelho{border-left-color:var(--vermelho)}
.os.concluido{background:#f1f3f5}
.os.atend{border-left-color:var(--roxo)}.os.atend .d{color:#6d3fc4}.dot.atend{background:var(--roxo)}
.os.peca{border-left-color:var(--azul)}.os.peca .d{color:#1558a8}.dot.peca{background:var(--azul)}
.l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.l1 b{font-size:17px}
.d{font-size:14px;font-weight:600}
.os.verde .d{color:var(--verde)}.os.amarelo .d{color:#9a7000}.os.vermelho .d{color:var(--vermelho)}
.os p{margin:0}
.fim{font-size:14px;background:#e4eaef;border-radius:6px;padding:8px}
dl{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0}
dt{font-size:12px;color:var(--mut)}dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.vazio{grid-column:1/-1;text-align:center;color:var(--mut);padding:30px 0}
#graf{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;padding-bottom:40px}
.gc{background:var(--card);border-radius:10px;padding:14px}
.gc h2{margin:0 0 8px;font-size:18px}
.gc svg{width:100%;max-width:360px;display:block;margin:auto}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;margin-top:8px}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px}
.wk{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:14px}
.wk button{padding:4px 12px}
dialog{border:0;border-radius:12px;padding:18px;width:min(1000px,96vw);max-height:92vh;color:var(--ink)}
dialog::backdrop{background:rgba(10,20,30,.5)}
dialog h2{margin:0 0 8px;font-size:20px}
.tecs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin:8px 0}
.tecs label{flex-direction:row;align-items:center;gap:8px;font-size:16px;color:var(--ink)}
.chip{background:#e4eaef;border-radius:20px;padding:4px 6px 4px 12px;font-size:15px}
.chip button{padding:0 8px;background:none;color:var(--vermelho)}
textarea{width:100%}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.thumbs img{height:70px;border:1px solid var(--line);border-radius:4px}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:12px;text-align:left;color:var(--mut);padding:4px}
td{padding:3px}
td input{width:100%;font:inherit;font-size:14px;padding:6px;border:1px solid var(--line);border-radius:4px}
.auto{flex-direction:row!important;align-items:flex-start;gap:8px;background:#fdf3d6;border-radius:6px;padding:8px;color:var(--ink)!important;font-size:14px!important}
.bar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center;margin-top:10px}
.err{color:var(--vermelho);margin:6px 0 0}
.ob{font-size:14px;resize:vertical}
.wrap{max-width:1100px;margin:auto;padding:8px 16px 40px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tabs button{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.tabs button.on{background:var(--acc);color:#fff}
.v-hist,.v-nova,.v-reg{display:none}
body[data-aba=hist] .v-hist,body[data-aba=nova] .v-nova,body[data-aba=reg] .v-reg{display:block}
body[data-aba=hist] .v-painel,body[data-aba=nova] .v-painel,body[data-aba=reg] .v-painel{display:none!important}
.bd{font-size:11px;font-weight:600;background:#e4eaef;border-radius:10px;padding:1px 8px;margin-left:6px}
.hh{background:var(--card);border-radius:10px;padding:12px 14px;margin-top:12px}
.hres{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-top:12px}
.v-hist label,.nf label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
.nf{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:10px}
.nf .full{grid-column:1/-1}
#login{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
body.in #login{display:none}
.lbox{background:#fff;border-radius:14px;padding:24px;width:min(380px,100%);display:grid;gap:12px}
.lbox h1{font-size:24px}.lbox p{margin:0;color:var(--mut)}
.lbox label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
.who{font-size:14px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.who button{padding:4px 10px}
.aj{display:grid;gap:8px;margin:10px 0}.aj button{text-align:left;padding:14px 16px}
.ur{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.ur small{color:var(--mut)}
.pm{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;margin:10px 0}
.gh{grid-column:1/-1;margin:14px 0 2px;font-size:18px;padding:8px 12px;border-radius:8px}
.gh.ga{background:#fff1dc;color:#9a5300;border-left:6px solid #e8890c}
.gh.gm{background:#e2f4e8;color:#1d6b3d;border-left:6px solid var(--verde)}
.os.fauto{border-left-color:#e8890c;background:#fff8ee}.os.fman{border-left-color:var(--verde);background:#f3faf5}
.tf{font-size:12px;font-weight:700;border-radius:10px;padding:1px 8px}.tf.ta{background:#ffe2b8;color:#9a5300}.tf.tm{background:#cfeedb;color:#1d6b3d}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:99;display:none;max-width:90vw;text-align:center}
.imp{display:grid;gap:10px;margin:10px 0}
.imp button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:14px 16px;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:10px}
.imp button b{font-size:18px;color:var(--acc)}.imp button span{font-size:14px;color:var(--mut)}
.imp button:hover{border-color:var(--acc)}
.hf{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}.hf label{min-width:220px}
.st{font-size:12px;font-weight:700;border-radius:10px;padding:1px 8px;color:#fff;background:var(--cinza)}
.st.aguardando{background:#5d6c7a}.st.atendimento{background:var(--roxo)}.st.concluido{background:var(--verde)}.st.peca{background:var(--azul)}
.tot{display:flex;align-items:baseline;gap:14px;margin-top:14px;background:var(--acc);color:#fff;border-radius:10px;padding:12px 18px}.tot b{font-size:52px;font-weight:800;line-height:1}.tot span{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.sync{font-size:13px;color:var(--mut);margin-top:6px}
.rf{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.rf fieldset{border:1px solid var(--line);border-radius:8px;margin:0;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}.rf legend{font-size:13px;color:var(--mut)}
.ck{flex-direction:row!important;align-items:center;gap:6px!important;font-size:15px!important;color:var(--ink)!important}
@media(max-width:520px){h1{font-size:22px}.s b{font-size:24px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>OS em aberto</h1>
    <div class="acts">
      <button id="bImpD">Importar dados</button>
      <span hidden><button id="bImp">Importar imagens</button>
      <button id="bPla">Importar planilha</button>
      <button id="bCol">Colar dados</button></span>
      <button id="bRel" class="ghost">Relatório</button>
      <button id="bAju" class="ghost">Ajustes</button>
      <span hidden><button id="bTec">Técnicos</button>
      <button id="bSync">Sincronizar</button>
      <button id="bKey">Chave Gemini</button></span>
    </div>
  </div>
  <div class="who" id="who"></div>
  <div class="sync" id="sync"></div>
  <nav class="tabs"><button data-aba="painel" class="on">Painel</button><button data-aba="hist">Histórico do veículo</button><button data-aba="nova">Nova OS</button><button data-aba="reg">Registro</button></nav>
  <div class="tot v-painel" aria-live="polite"><b id="totN">0</b><span>OS abertas</span></div>
  <div class="sum v-painel" id="sum"></div>
  <div class="flt v-painel">
    <label>Situação<select id="fSit"><option value="pend">Pendentes</option><option value="conc">Concluídas</option><option value="todas">Todas</option></select></label>
    <label>Técnico<select id="fTec"></select></label>
    <label>Buscar OS<input type="text" id="fQ" placeholder="Código BYD ou TRACCIÓN" autocomplete="off"></label>
  </div>
</header>
<main id="grid" class="v-painel"></main>
<section id="graf" class="v-painel"></section>
<section id="vHist" class="v-hist wrap">
  <h2>Histórico do veículo</h2>
  <div class="hf"><label>Buscar por<select id="hCat"><option value="veic">Veículo (prefixo ou VIN)</option><option value="gar">Garagem</option><option value="pla">Placa</option></select></label>
  <label>Pesquisa<input type="text" id="hQ" list="dlHist" placeholder="Ex.: 71115" autocomplete="off"></label></div>
  <datalist id="dlHist"></datalist>
  <div id="hRes"></div>
</section>
<section id="vNova" class="v-nova wrap">
  <h2>Adicionar ordem de serviço</h2>
  <div class="nf">
    <label>Tipo<input type="text" id="nTipo" value="Concessionária" readonly></label>
    <label><span id="nCodL">Código</span><input type="text" id="nCod" autocomplete="off"></label>
    <label>Garagem<select id="nGar"></select></label>
    <label>Frota (prefixo)<input type="text" id="nFro" autocomplete="off"></label>
    <label>Km (opcional)<input type="text" id="nKm" inputmode="numeric"></label>
    <label>Data de abertura<input type="date" id="nAb"></label>
    <label>VIN (opcional)<input type="text" id="nVin" autocomplete="off"></label>
    <label>Placa (opcional)<input type="text" id="nPla" autocomplete="off"></label>
    <label>Status inicial<select id="nSt"><option value="aguardando">Aguardando</option><option value="atendimento">Em atendimento</option></select></label>
    <label class="full">Descrição<textarea id="nDesc" rows="3"></textarea></label>
    <label class="full">Observação (opcional)<textarea id="nObs" rows="2"></textarea></label>
  </div>
  <div class="bar"><span id="nMsg"></span><button id="nAdd">Adicionar OS</button></div>
</section>
<section id="vReg" class="v-reg wrap">
  <h2>Registro de alterações</h2>
  <div class="hf"><label>Usuário<select id="rgU"></select></label><label>OS<input type="text" id="rgQ" placeholder="Código da OS" autocomplete="off"></label><label>De<input type="date" id="rgDe"></label><label>Até<input type="date" id="rgAte"></label></div>
  <div id="rgRes"></div>
</section>
<input type="file" id="fIn" accept="image/*" multiple hidden>
<input type="file" id="fPla" accept=".xlsx,.xls,.csv,.tsv,.txt" hidden>
<div id="login" role="dialog" aria-modal="true" aria-label="Entrar">
  <div class="lbox"><h1>OS em aberto</h1><p>Pós-venda BYD. Entre com o seu usuário.</p>
    <label>Usuário<select id="lUser"></select></label>
    <label>Senha<input type="password" id="lPw" autocomplete="current-password"></label>
    <p class="err" id="lErr"></p>
    <button id="lOk">Entrar</button>
    <button class="ghost" id="lCfg">Configurar este aparelho</button>
  </div>
</div>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>

<script>
const KEY='osbyd.v1',KK='osbyd.gemini',KT='osbyd.tec',MODEL='gemini-3.8-flash';
const chave=()=>localStorage.getItem(KK)||'';
let GAR=['AutoBless','AlfaRodobus','MobiBrasil','MoveBuss','CampoBelo','TransWolf','Pessêgo','Express','TransPass','GatoPreto','SantaBrigda','SusanTour','KBPX','NorteBuss G1','NorteBuss G2'];
const TEC0=['Victor Tavares','Mario','Alex','Yan','Danilo','José Carlos','Ricardo','Roberto','Alexon','Angel','Carlos','Fell','Yeferson','Alessandro','Fábrica'];
const SEED=[];
const ST={aguardando:'Aguardando',atendimento:'Em atendimento',peca:'Aguardando peça',concluido:'Concluído'};
const SEV={vermelho:3,amarelo:2,verde:1,cinza:0};
const PAL=['#0d5c75','#d3382d','#e6ac12','#2e9e5b','#7a4fb5','#e07a1f','#3a8fd6','#b5427a','#6b8e23','#8c6d46','#2bb3a3','#5d6c7a','#c24a1a','#9b59b6'];
const $=s=>document.querySelector(s), dlg=$('#dlg');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const pad=n=>String(n).padStart(2,'0');
const fm=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1);
let data,tecs,abertos=new Set(),ano=new Date().getFullYear(),corSel=null;
try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(data))data=SEED;
try{tecs=JSON.parse(localStorage.getItem(KT))}catch(e){}
if(!Array.isArray(tecs))tecs=TEC0;
const KC='osbyd.cfg';let cfg=null,usuario=null;
try{cfg=JSON.parse(localStorage.getItem(KC))}catch(e){}
if(cfg){if(Array.isArray(cfg.gars)&&cfg.gars.length)GAR=cfg.gars;if(Array.isArray(cfg.tecs))tecs=cfg.tecs}
const can=k=>!!(usuario&&usuario.perms&&usuario.perms[k]);
let snap=new Map();
const sj=o=>JSON.stringify({...o,at:0});
const snapshot=()=>{snap=new Map(data.map(o=>[o.os,sj(o)]))};
const gravaLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(KT,JSON.stringify(tecs));if(cfg)localStorage.setItem(KC,JSON.stringify(cfg))}catch(e){}};
const save=()=>{
  const t=Date.now();data.forEach(o=>{if(snap.get(o.os)!==sj(o))o.at=t});snapshot();
  if(cfg&&(JSON.stringify(cfg.tecs)!==JSON.stringify(tecs)||JSON.stringify(cfg.gars)!==JSON.stringify(GAR))){cfg.tecs=tecs;cfg.gars=GAR;cfg.cat=t}
  gravaLocal();push();
};
snapshot();
const pend=o=>o.status!=='concluido';
const tipoFech=o=>o.fechamento||(/fechado automaticamente/i.test(o.obs||'')?'auto':'manual');
const subseq=(a,b)=>{let i=0;for(const ch of b)if(ch===a[i])i++;return i===a.length};
function achaOS(o,q){return norm(o.os).includes(q)||(o.origem==='concessionaria'&&q.length>=4&&subseq(q,norm(PREFIXO)))}
function garagem(c){const k=norm(c);if(!k)return'Sem cliente';return GAR.find(g=>{const n=norm(g);return k.includes(n)||(k.length>2&&n.includes(k))})||String(c).trim()}
function pd(s){const m=/(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s||'');return m?new Date(+m[3],m[2]-1,+m[1]):null}
// dias úteis (seg–sex) desde a abertura, igual à coluna "Dias aberta" do relatório
function dias(o){const d=pd(o.abertura);if(!d)return null;const t=new Date();t.setHours(0,0,0,0);let n=0;const c=new Date(d);
  for(;;){c.setDate(c.getDate()+1);if(c>t)break;const w=c.getDay();if(w&&w<6)n++}return n}
const cor=n=>n==null?'cinza':n<=2?'verde':n<=5?'amarelo':'vermelho';
const txt=n=>n==null?'sem data':n===1?'1 dia útil':n+' dias úteis';
function fillTec(){const v=$('#fTec').value;$('#fTec').innerHTML='<option value="">Todos</option>'+tecs.map(t=>`<option ${t===v?'selected':''}>${esc(t)}</option>`).join('')}

function render(){
  const sit=can('concluidas')?$('#fSit').value:'pend',tec=$('#fTec').value,q=norm($('#fQ').value),filtrando=tec||sit==='conc'||corSel||q,concMode=sit==='conc'&&!corSel&&!q;
  const cnt={verde:0,amarelo:0,vermelho:0,peca:0},g={},tot={};let abertas=0;
  GAR.forEach(n=>g[n]=[]);
  data.forEach(o=>{
    const n=dias(o),c=cor(n),fin=!pend(o),k=garagem(o.cliente);
    if(!fin){abertas++;if(cnt[c]!==undefined)cnt[c]++;if(o.status==='peca')cnt.peca++;tot[k]=(tot[k]||0)+1}
    if((fin&&!can('concluidas'))||(corSel?(fin||!(corSel==='peca'?o.status==='peca':c===corSel)):(!q&&((sit==='pend'&&fin)||(sit==='conc'&&!fin))))||(tec&&!(o.tecnicos||[]).includes(tec))||(q&&!achaOS(o,q)))return;
    (g[concMode&&fin?(tipoFech(o)==='auto'?'1|':'2|')+k:k]??=[]).push({o,n,c,fin});
  });
  $('#sum').innerHTML=[['vermelho','mais de 5 dias úteis'],['amarelo','de 3 a 5 dias úteis'],['verde','até 2 dias úteis'],['peca','aguardando peça']]
    .map(([k,l])=>`<button class="s ${k} ${corSel===k?'active':''}" data-cor="${k}" aria-pressed="${corSel===k}"><b>${cnt[k]}</b><span>${l}</span></button>`).join('');
  const blocks=Object.entries(g).filter(([,a])=>a.length||!filtrando).map(([nome,arr])=>{
    arr.sort((a,b)=>a.fin-b.fin||(b.n??-1)-(a.n??-1));
    const ab=arr.filter(x=>!x.fin);
    return{nome,arr,ab,worst:ab.reduce((w,x)=>SEV[x.c]>SEV[w]?x.c:w,'cinza')};
  }).sort((a,b)=>(concMode?(+a.nome[0]||0)-(+b.nome[0]||0):0)||SEV[b.worst]-SEV[a.worst]||b.arr.length-a.arr.length);
  let ult='';

function graficos(tot){

  const soma=it.reduce((s,x)=>s+x.v,0);let a=-Math.PI/2,p='';
  const P=t=>[90+80*Math.cos(t),90+80*Math.sin(t)];
  const tx=(X,Y,v)=>`<text x="${X}" y="${Y}" text-anchor="middle" font-size="15" font-weight="700" fill="#16222d" stroke="#fff" stroke-width="3" paint-order="stroke">${v}</text>`;
  it.forEach(x=>{const f=x.v/soma;
    if(f>=1){p+=`<circle cx="90" cy="90" r="80" fill="${x.c}"/>`+tx(90,96,x.v);return}
    const b=a+f*2*Math.PI,[x1,y1]=P(a),[x2,y2]=P(b);
    p+=`<path d="M90 90L${x1} ${y1}A80 80 0 ${f>.5?1:0} 1 ${x2} ${y2}Z" fill="${x.c}" stroke="#fff" stroke-width="2"/>`;if(f>=.04){const m=(a+b)/2;p+=tx(90+52*Math.cos(m),96+52*Math.sin(m),x.v)}a=b});
  const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const vs=MES.map((_,m)=>data.filter(o=>{const d=pd(o.abertura);return d&&d.getFullYear()===ano&&d.getMonth()===m}).length),mx=Math.max(1,...vs);
  const bars=vs.map((v,i)=>{const h=v*130/mx,x=10+i*27.5;
    return`<rect x="${x}" y="${160-h}" width="20" height="${h}" rx="2" fill="#0d5c75"/><text x="${x+10}" y="${154-h}" text-anchor="middle" font-size="12" font-weight="600" fill="#16222d">${v||''}</text><text x="${x+10}" y="178" text-anchor="middle" font-size="10" fill="#5d6c7a">${MES[i]}</text>`}).join('');
  $('#graf').innerHTML=`
  <div class="gc"><h2>OS pendentes por garagem</h2>${soma?`<svg viewBox="0 0 180 180" role="img" aria-label="Pizza de OS por garagem">${p}</svg>
    <div class="leg">${it.map(x=>`<span><i style="background:${x.c}"></i>${esc(x.n)}: ${x.v}</span>`).join('')}</div>`:'<p class="vazio">Sem OS pendentes.</p>'}</div>

const PROMPT='Esta imagem é uma tabela de ordens de serviço. Extraia TODAS as linhas. Responda somente com um array JSON de objetos com as chaves: os, cliente, frota, km, abertura (formato DD/MM/AAAA), vin (17 caracteres, junte as quebras de linha), placa (somente se existir uma coluna de placa), descricao (apenas o texto em português, junte as quebras de linha). Use null quando o campo estiver vazio ou escrito "null". Não invente dados.';

const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)});
let modelos=null;
async function listaModelos(){
  if(modelos)return modelos;
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=100&key=${chave()}`),j=await r.json();
    modelos=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/flash/.test(m.name)&&!/image|tts|live|audio|thinking|exp|robotics|computer/.test(m.name)).map(m=>m.name.replace('models/','')).filter(n=>n!==MODEL);
  }catch(e){modelos=[]}
  return modelos;
}
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function lerImagem(f){
  const dados=await b64(f),body=JSON.stringify({contents:[{parts:[{text:PROMPT},{inline_data:{mime_type:f.type||'image/jpeg',data:dados}}]}],generationConfig:{responseMimeType:'application/json',temperature:0}});
  let ultimo='';
  for(const m of [MODEL,...await listaModelos()]){
    for(let n=0;n<2;n++){
      let r,j;
      try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${chave()}`,{method:'POST',headers:{'Content-Type':'application/json'},body})}catch(e){throw new Error('sem conexão com o Gemini')}
      j=await r.json().catch(()=>({}));
      if(r.ok){try{return JSON.parse(j.candidates[0].content.parts.map(x=>x.text||'').join('').replace(/```json|```/g,'').trim())}catch(e){ultimo='resposta ilegível';break}}
      ultimo=j.error?.message||('erro '+r.status);
      if(r.status===503||r.status===429||/demand|overload/i.test(ultimo)){await espera(3000);continue}
      break;
    }
  }
  throw new Error(/demand|overload|quota|429|503/i.test(ultimo)?'o Gemini está sobrecarregado agora. Tente de novo em alguns minutos.':ultimo);
}
async function importar(files){

const COLS=[['os','OS'],['cliente','Cliente'],['frota','Frota'],['km','Km'],['abertura','Abertura'],['vin','VIN'],['placa','Placa'],['desc','Descrição']];
function conferir(rows,urls,erros=[]){
  const falt=data.filter(o=>pend(o)&&o.origem!=='concessionaria'&&!rows.some(r=>r.os===o.os));

  ${rows.length&&falt.length?`<label class="auto"><input type="checkbox" id="auto" checked><span>Fechar automaticamente ${falt.length} OS pendentes que não aparecem neste relatório: ${esc(falt.map(o=>o.os).join(', '))}. Desmarque se você importou só parte do relatório.</span></label>`:''}
  ${jaConc.length?`<label class="auto"><input type="checkbox" id="reabre"><span><b>${jaConc.length} OS desta lista estão como concluídas no painel</b>, por isso não contam como abertas: ${esc(jaConc.join(', '))}. Marque para reabrir (voltam para Aguardando). Desmarcado, elas continuam concluídas.</span></label>`:''}
  <p class="err" id="sErr"></p><div class="bar"><button class="ghost" id="bCan">Cancelar</button><button id="bSave" ${rows.length?'':'disabled'}>Salvar</button></div>`;
  dlg.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>b.closest('tr').remove());

    try{
      const nums=new Set();let novas=0,atual=0,fech=0,reab=0,mant=0;const hoje=new Date().toLocaleDateString('pt-BR');

        else{data.push({...r,status:'aguardando',tecnicos:[],obs:''});novas++}
      });

      reg('—','Importação','',`${novas} novas, ${atual} atualizadas${fech?', '+fech+' fechadas automaticamente':''}`,'');save();dlg.close();aba('painel');render();
      toast(`${novas} OS nova(s), ${atual} atualizada(s)`+(fech?`, ${fech} fechada(s) automaticamente`:'')+(mant?`, ${mant} já concluída(s) mantida(s) como concluída`:'')+(reab?`, ${reab} reaberta(s)`:'')+'.');

function csvLinhas(txt){
  const d=[';','\t',','].map(c=>[c,txt.split('\n')[0].split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const L=[];let l=[],c='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){l.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;l.push(c);c='';L.push(l);l=[]}
    else c+=ch}
  if(c||l.length){l.push(c);L.push(l)}
  return L;
}
function dataBR(v){
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return pad(d.getUTCDate())+'/'+pad(d.getUTCMonth()+1)+'/'+d.getUTCFullYear()}
  const s=String(v??'').trim();
  let m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);if(m)return pad(+m[3])+'/'+pad(+m[2])+'/'+m[1];
  m=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/.exec(s);if(m)return pad(+m[1])+'/'+pad(+m[2])+'/'+(m[3].length===2?'20'+m[3]:m[3]);
  return s;
}
const CAMPOS={os:/^os$|^ordem/,cliente:/^(cliente|garagem)/,frota:/^(frota|prefixo)/,km:/^km/,abertura:/^(ab|data)/,vin:/^(vin|chassi)/,placa:/^placa/,desc:/^descri/};
function linhasPlanilha(L){
  const hi=L.slice(0,15).findIndex(r=>r.some(c=>norm(c)==='os')&&r.some(c=>/^(cliente|garagem)/.test(norm(c))));
  if(hi<0)throw new Error('não achei o cabeçalho. A planilha precisa ter as colunas OS e Cliente (veja a planilha_base).');
  const idx={};
  L[hi].forEach((c,i)=>{const k=norm(c);for(const [n,re] of Object.entries(CAMPOS))if(idx[n]===undefined&&re.test(k))idx[n]=i});
  const get=(r,k)=>{const v=idx[k]===undefined?'':r[idx[k]];return String(v??'').trim()==='null'?'':v};
  const S=(r,k)=>String(get(r,k)??'').trim();
  const rows=[];let ign=0;
  L.slice(hi+1).forEach(r=>{

async function sync(){

    const r=await fetch(gUrl()+'?t='+Date.now(),{headers:gHd()});
    let sha=null,rem=null;
    if(r.ok){const j=await r.json();sha=j.sha;rem=JSON.parse(dec(j.content))}
    else if(r.status!==404)throw new Error(r.status===401?'token inválido':r.status===403?'sem permissão':'erro '+r.status);
    if(rem)mescla(rem);
    if(!cfg)await semeia();

    if(!rem||JSON.stringify(rem)!==novo){
      const body={message:'Atualização do painel',content:enc(novo)};if(sha)body.sha=sha;
      const w=await fetch(gUrl(),{method:'PUT',headers:{...gHd(),'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!w.ok)throw new Error(w.status===409?'conflito de gravação':w.status===401?'token inválido':w.status===403?'sem permissão':'erro '+w.status);
    }

  }finally{sincronizando=false;if(denovo){denovo=false;setTimeout(sync,300)}}
}

const h53=(s,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const temSubtle=()=>!!(window.crypto&&crypto.subtle);
async function mkHash(pw,salt){
  salt=salt||hex(crypto.getRandomValues(new Uint8Array(16)));

    const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},k,256);

}
async function confere(pw,h){
  const [tp,salt]=String(h||'').split(':');
  if(tp==='w')return h==='w:'+salt+':'+h53(salt+pw);
  if(tp==='p1'&&temSubtle())return h===await mkHash(pw,salt);
  return false;
}

  if(Date.now()<bloq){$('#lErr').textContent='Muitas tentativas. Aguarde alguns segundos.';return}
  if(await confere($('#lPw').value,u.hash)){falhas=0;entra(u)}
  else{falhas++;if(falhas>=5){bloq=Date.now()+30000;falhas=0}$('#lErr').textContent='Usuário ou senha incorretos.'}
};
$('#lPw').onkeydown=e=>{if(e.key==='Enter')$('#lOk').click()};
$('#lCfg').onclick=()=>$('#bSync').click();
function entra(u){
  usuario=u;sessionStorage.setItem('osbyd.u',u.id);document.body.classList.add('in');$('#lPw').value='';
  applyUI();render();
  if(u.trocar)trocaSenha(true);
}
function sai(){sessionStorage.clear();location.reload()}
function applyUI(){
  $('#who').innerHTML=`Olá, <b>${esc(usuario.nome)}</b> <button class="ghost" id="bPw">Minha senha</button> <button class="ghost" id="bOut">Sair</button>`;
  $('#bPw').onclick=()=>trocaSenha(false);$('#bOut').onclick=sai;
  $('#bImpD').hidden=!can('importar');$('#bRel').hidden=!can('relatorio');
  document.querySelector('[data-aba=hist]').hidden=!can('historico');
  document.querySelector('[data-aba=nova]').hidden=!can('nova');
  document.querySelector('[data-aba=reg]').hidden=!can('registro');
  const conc=can('concluidas');
  [...$('#fSit').options].forEach(o=>{o.hidden=o.disabled=(o.value!=='pend'&&!conc)});
  if(!conc)$('#fSit').value='pend';
  const ab=document.body.dataset.aba;
  if((ab==='hist'&&!can('historico'))||(ab==='nova'&&!can('nova'))||(ab==='reg'&&!can('registro')))aba('painel');
}
function trocaSenha(obrig){
  dlg.innerHTML=`<h2>${obrig?'Defina a sua senha':'Minha senha'}</h2>${obrig?'<p>Você está usando a senha padrão. Escolha uma senha nova.</p>':''}
  <label>Senha atual<input type="password" id="pA" autocomplete="current-password"></label>
  <label>Nova senha (mínimo 6 caracteres)<input type="password" id="pN" autocomplete="new-password"></label>
  <label>Repita a nova senha<input type="password" id="pR" autocomplete="new-password"></label><p class="err" id="pE"></p>
  <div class="bar"><button class="ghost" id="pC">${obrig?'Depois':'Cancelar'}</button><button id="pOk">Salvar</button></div>`;
  dlg.showModal();$('#pC').onclick=()=>dlg.close();
  $('#pOk').onclick=async()=>{
    const er=x=>{$('#pE').textContent=x};
    if(!await confere($('#pA').value,usuario.hash))return er('Senha atual incorreta.');
    const n=$('#pN').value;
    if(n.length<6)return er('A nova senha precisa ter ao menos 6 caracteres.');
    if(n!==$('#pR').value)return er('As senhas novas não conferem.');
    if(n===inicial(usuario.nome))return er('Escolha uma senha diferente da padrão.');
    usuario.hash=await mkHash(n);usuario.trocar=false;usuario.at=Date.now();
    reg('—','Senha alterada','','','');save();dlg.close();toast('Senha alterada.');
  };
}

// ----- senha master e ajustes -----
function mestre(fn){
  if(sessionStorage.getItem('osbyd.m')==='1')return fn();
  dlg.innerHTML=`<h2>Senha master</h2><label>Digite a senha master para continuar<input type="password" id="mp" autocomplete="off"></label><p class="err" id="me"></p>
  <div class="bar"><button class="ghost" id="mC">Cancelar</button><button id="mOk">Entrar</button></div>`;
  dlg.showModal();$('#mp').focus();
  const ok=async()=>{if(await confereMestre($('#mp').value)){sessionStorage.setItem('osbyd.m','1');dlg.close();fn()}else{await new Promise(r=>setTimeout(r,700));$('#me').textContent='Senha incorreta.'}};
  $('#mOk').onclick=ok;$('#mp').onkeydown=e=>{if(e.key==='Enter')ok()};$('#mC').onclick=()=>dlg.close();
}
$('#bAju').onclick=()=>mestre(ajustes);
function ajustes(){
  dlg.innerHTML=`<h2>Ajustes</h2><div class="aj">
    <button data-a="usuarios"><b>Usuários e permissões</b></button><button data-a="garagens"><b>Garagens</b></button><button data-a="tecnicos"><b>Técnicos</b></button>
    <button data-a="sync"><b>Sincronização (GitHub)</b></button><button data-a="gemini"><b>Chave Gemini</b></button><button data-a="master"><b>Trocar senha master</b></button></div>
  <div class="bar"><button class="ghost" id="aX">Fechar</button></div>`;
  if(!dlg.open)dlg.showModal();
  $('#aX').onclick=()=>dlg.close();
  dlg.querySelector('.aj').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='usuarios')telaUsuarios();else if(a==='garagens')telaGaragens();else if(a==='master')trocaMaster();
    else{dlg.close();$({tecnicos:'#bTec',sync:'#bSync',gemini:'#bKey'}[a]).click()}};
}
function telaUsuarios(){
  const us=cfg.users.filter(u=>!u.removido).sort((a,b)=>a.nome.localeCompare(b.nome));
  dlg.innerHTML=`<h2>Usuários e permissões</h2><div id="ul">${us.map(u=>`<div class="ur"><span><b>${esc(u.nome)}</b> <small>${esc(u.garagem||'sem garagem')}${u.ativo?'':' · desativado'}${u.trocar?' · senha padrão':''}</small></span><button class="ghost" data-u="${esc(u.id)}">Editar</button></div>`).join('')}</div>
  <div class="bar"><button class="ghost" id="uV">Voltar</button><button id="uN">Adicionar usuário</button></div>`;
  $('#ul').onclick=e=>{const b=e.target.closest('[data-u]');if(b)editaUsuario(b.dataset.u)};
  $('#uV').onclick=ajustes;$('#uN').onclick=()=>editaUsuario(null);
}
function editaUsuario(id){
  const u=id?cfg.users.find(x=>x.id===id):{nome:'',garagem:'',ativo:true,perms:permsDe([])};
  dlg.innerHTML=`<h2>${id?'Editar':'Novo'} usuário</h2>
  <div class="nf"><label>Nome<input type="text" id="eN" value="${esc(u.nome)}"></label>
  <label>Garagem<select id="eG"><option value="">(nenhuma)</option>${GAR.map(g=>`<option ${g===u.garagem?'selected':''}>${esc(g)}</option>`).join('')}</select></label>
  <label>Aplicar modelo de permissões<select id="eM"><option value="">—</option>${Object.entries(MODELOS).map(([k,v])=>`<option value="${k}">${esc(v[0])}</option>`).join('')}</select></label>
  <label class="ck"><input type="checkbox" id="eA" ${u.ativo?'checked':''}> Usuário ativo</label></div>
  <div class="pm">${PERMS.map(([k,l])=>`<label class="ck"><input type="checkbox" data-p="${k}" ${u.perms[k]?'checked':''}> ${esc(l)}</label>`).join('')}</div>
  <p class="err" id="eE"></p>
  <div class="bar"><button class="ghost" id="eV">Voltar</button>${id?'<button class="ghost" id="eR">Redefinir senha padrão</button><button class="ghost" id="eD">Remover</button>':''}<button id="eS">Salvar</button></div>`;
  $('#eM').onchange=()=>{const m=MODELOS[$('#eM').value];if(m)dlg.querySelectorAll('[data-p]').forEach(c=>{c.checked=m[1].includes(c.dataset.p)})};
  $('#eV').onclick=telaUsuarios;
  $('#eS').onclick=async()=>{
    const nome=$('#eN').value.trim();
    if(!nome)return $('#eE').textContent='Informe o nome.';
    if(cfg.users.some(x=>!x.removido&&x.id!==id&&norm(x.nome)===norm(nome)))return $('#eE').textContent='Já existe um usuário com este nome.';
    const perms=Object.fromEntries([...dlg.querySelectorAll('[data-p]')].map(c=>[c.dataset.p,c.checked]));
    if(id)Object.assign(u,{nome,garagem:$('#eG').value,ativo:$('#eA').checked,perms,at:Date.now()});
    else cfg.users.push({id:'u_'+norm(nome)+'_'+Date.now().toString(36),nome,garagem:$('#eG').value,ativo:$('#eA').checked,trocar:true,perms,hash:await mkHash(inicial(nome)),at:Date.now()});
    reg('—',id?'Usuário alterado':'Usuário criado','','',nome);save();
    if(usuario){usuario=cfg.users.find(x=>x.id===usuario.id)||usuario;applyUI()}
    telaUsuarios();
  };
  if(id){
    $('#eR').onclick=async()=>{u.hash=await mkHash(inicial(u.nome));u.trocar=true;u.at=Date.now();reg('—','Senha redefinida','','',u.nome);save();toast('Senha de '+u.nome+' redefinida para a padrão.');telaUsuarios()};
    $('#eD').onclick=()=>{if(!confirm('Remover '+u.nome+'?'))return;u.removido=true;u.ativo=false;u.at=Date.now();reg('—','Usuário removido','','',u.nome);save();telaUsuarios()};
  }
}
function telaGaragens(){
  const li=n=>`<div class="ur" data-o="${esc(n)}"><input type="text" value="${esc(n)}" style="flex:1"><button class="ghost" data-del aria-label="Remover">×</button></div>`;
  dlg.innerHTML=`<h2>Garagens</h2><div id="gl">${GAR.map(li).join('')}</div>
  <div class="bar"><input type="text" id="gN" placeholder="Nova garagem"><button class="ghost" id="gA">Adicionar</button></div><p class="err" id="gE"></p>
  <div class="bar"><button class="ghost" id="gV">Voltar</button><button id="gS">Salvar</button></div>`;
  $('#gl').onclick=e=>{const b=e.target.closest('[data-del]');if(!b)return;const r=b.closest('.ur'),o=r.dataset.o,n=data.filter(x=>garagem(x.cliente)===o).length;
    if(o&&n){$('#gE').textContent=`Não dá para remover ${o}: há ${n} OS nessa garagem.`;return}r.remove()};
  $('#gA').onclick=()=>{const v=$('#gN').value.trim();if(v){$('#gl').insertAdjacentHTML('beforeend',li(v).replace('data-o="'+esc(v)+'"','data-o=""'));$('#gN').value=''}};
  $('#gV').onclick=ajustes;
  $('#gS').onclick=()=>{
    const rows=[...dlg.querySelectorAll('#gl .ur')].map(r=>({o:r.dataset.o,n:r.querySelector('input').value.trim()})).filter(x=>x.n);
    const nomes=rows.map(x=>x.n);
    if(new Set(nomes.map(norm)).size!==nomes.length)return $('#gE').textContent='Há nomes repetidos.';
    rows.forEach(x=>{if(x.o&&x.o!==x.n)data.forEach(o=>{if(garagem(o.cliente)===x.o)o.cliente=x.n})});
    GAR=nomes;reg('—','Garagens alteradas','','',nomes.length+' garagens');save();ajustes();toast('Garagens salvas.');
  };
}
function trocaMaster(){
  dlg.innerHTML=`<h2>Trocar senha master</h2><label>Nova senha master (mínimo 8 caracteres)<input type="password" id="nm1" autocomplete="new-password"></label>
  <label>Repita a nova senha<input type="password" id="nm2" autocomplete="new-password"></label><p class="err" id="nmE"></p>
  <div class="bar"><button class="ghost" id="nmV">Voltar</button><button id="nmS">Salvar</button></div>`;
  $('#nmV').onclick=ajustes;
  $('#nmS').onclick=async()=>{const a=$('#nm1').value;
    if(a.length<8)return $('#nmE').textContent='Use ao menos 8 caracteres.';
    if(a!==$('#nm2').value)return $('#nmE').textContent='As senhas não conferem.';
    cfg.master=await mkHash(a);cfg.cat=Date.now();reg('—','Senha master alterada','','','');save();ajustes();toast('Senha master alterada.')};
}

// ----- registro de alterações -----
const tabelaLog=l=>`<div class="tw"><table><thead><tr><th>Data/hora</th><th>Usuário</th><th>OS</th><th>Ação</th><th>Mudança</th><th>Motivo</th></tr></thead><tbody>${l.map(x=>`<tr><td>${new Date(x.t).toLocaleString('pt-BR')}</td><td>${esc(x.u)}</td><td>${esc(x.os)}</td><td>${esc(x.ac)}</td><td>${esc(x.de)}${x.de&&x.para?' → ':''}${esc(x.para)}</td><td>${esc(x.mot)}</td></tr>`).join('')}</tbody></table></div>`;
function renderReg(){
  if(!cfg||!can('registro'))return;
  const sel=$('#rgU').value,us=[...new Set(cfg.log.map(x=>x.u))].sort();
  $('#rgU').innerHTML='<option value="">Todos</option>'+us.map(u=>`<option ${u===sel?'selected':''}>${esc(u)}</option>`).join('');
  const q=norm($('#rgQ').value),de=$('#rgDe').value?new Date($('#rgDe').value+'T00:00').getTime():0,ate=$('#rgAte').value?new Date($('#rgAte').value+'T23:59:59').getTime():Infinity;
  const l=cfg.log.filter(x=>(!sel||x.u===sel)&&(!q||norm(x.os).includes(q))&&x.t>=de&&x.t<=ate).sort((a,b)=>b.t-a.t).slice(0,300);
  $('#rgRes').innerHTML=l.length?tabelaLog(l):'<p class="vazio">Nenhum registro.</p>';
}
$('#rgU').onchange=$('#rgQ').oninput=$('#rgDe').onchange=$('#rgAte').onchange=renderReg;
function logOS(os){
  if(!can('registro'))return;
  const l=cfg.log.filter(x=>x.os===os).sort((a,b)=>b.t-a.t);
  dlg.innerHTML=`<h2>Registro de ${esc(os)}</h2>${l.length?tabelaLog(l):'<p class="vazio">Sem registros para esta OS.</p>'}<div class="bar"><button id="lgX">Fechar</button></div>`;
  dlg.showModal();$('#lgX').onclick=()=>dlg.close();
}

(async()=>{
  if(!cfg&&gh)await semeia();
  fillTec();fillLogin();render();aba('painel');
  const uid=sessionStorage.getItem('osbyd.u');
  const u=cfg&&cfg.users.find(x=>x.id===uid&&x.ativo&&!x.removido);
  if(u)entra(u);
  sync();
})();
</script>
</body>
</html>
